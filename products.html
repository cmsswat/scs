<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Stock | Swat Computer Shop</title>
<meta name="description" content="Search, edit and monitor computer shop inventory with low-stock and out-of-stock alerts.">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/products.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="card">
      <h3>📦 Inventory</h3>
      <div class="toolbar">
        <input type="search" id="search" placeholder="🔍 Search product or category">
        <select id="catFilter"></select>
        <select id="statusFilter">
          <option value="">All status</option><option value="ok">In stock</option>
          <option value="low">Low stock</option><option value="out">Out of stock</option>
        </select>
        <button class="btn ghost" id="exportBtn">⬇️ Export CSV</button>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px" id="summary"></p>
      <div id="table"></div>
    </section>
    <section class="card" id="editBox" style="margin-top:18px;display:none">
      <h3>✏️ Edit product</h3>
      <form id="editForm" autocomplete="off">
        <input type="hidden" id="eid">
        <div class="row">
          <div class="field"><label for="ename">Product name</label><input type="text" id="ename"></div>
          <div class="field"><label for="ecat">Category</label><input type="text" id="ecat"></div>
        </div>
        <div class="row">
          <div class="field"><label for="eqty">Quantity</label><input type="number" id="eqty" min="0"></div>
          <div class="field"><label for="ecost">Purchase cost</label><input type="number" id="ecost" min="0"></div>
        </div>
        <div class="field"><label for="eprice">Sale price</label><input type="number" id="eprice" min="0"></div>
        <button class="btn green" type="submit">💾 Update</button>
        <button class="btn ghost" type="button" id="cancelEdit">Cancel</button>
      </form>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
</body>
</html>
