<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice | Swat Computer Shop</title>
<meta name="description" content="Printable customer invoice generated by the Swat Computer Shop Management System.">
<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="invoice.css">
</head>
<body>
  <div class="actions">
    <button class="btn" onclick="window.print()">🖨️ Print / Save PDF</button>
    <a class="btn ghost" href="../sale.html">← Back to sales</a>
  </div>
  <main class="sheet" id="sheet"></main>

<script src="../js/utils.js"></script>
<script src="../js/storage.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const s=DB.settings(), sale=DB.sale(id);
const el=document.getElementById('sheet');
if(!sale){
  el.innerHTML='<p style="text-align:center;color:#d94141">Invoice not found. <a href="../sale.html">Go back</a></p>';
}else{
  const sub=sale.items.reduce((a,i)=>a+i.qty*i.price,0);
  el.innerHTML=`
  <div class="head">
    <div style="display:flex;gap:12px;align-items:center">
      <img src="../images/logo.png" alt="Shop logo">
      <div class="shop"><h1>${s.shopName}</h1><p>${s.address}</p><p>Phone: ${s.phone}</p></div>
    </div>
    <div class="meta"><b>INVOICE</b>
      No: ${sale.id}<br>Date: ${Utils.date(sale.date)}</div>
  </div>
  <p class="to"><b>Customer:</b> ${sale.customer}${sale.phone?' • '+sale.phone:''}</p>
  <table>
    <thead><tr><th>#</th><th>Product</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
    <tbody>${sale.items.map((i,n)=>`<tr><td>${n+1}</td><td>${i.name}</td><td class="r">${i.qty}</td>
      <td class="r">${Utils.money(i.price)}</td><td class="r">${Utils.money(i.qty*i.price)}</td></tr>`).join('')}</tbody>
  </table>
  <div class="totals">
    <div><span>Subtotal</span><span>${Utils.money(sub)}</span></div>
    <div><span>Discount</span><span>- ${Utils.money(sale.discount)}</span></div>
    <div class="grand"><span>Grand total</span><span>${Utils.money(sale.total)}</span></div>
  </div>
  <p class="foot">Thank you for shopping with ${s.shopName}! Goods once sold are checked and warranted as per company policy.</p>`;
  document.title='Invoice '+sale.id+' | '+s.shopName;
}
</script>
</body>
</html>
