<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports | Swat Computer Shop</title>
<meta name="description" content="Sales, purchase and profit reports for any date range with best selling products.">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/reports.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="card no-print">
      <h3>📊 Choose period</h3>
      <div class="toolbar">
        <div><label for="from">From</label><input type="date" id="from"></div>
        <div><label for="to">To</label><input type="date" id="to"></div>
        <div><label>&nbsp;</label>
          <button class="btn ghost" id="exportBtn">⬇️ Export CSV</button>
          <button class="btn orange" id="printBtn">🖨️ Print report</button></div>
      </div>
    </section>
    <section class="grid cols-4" id="cards" style="margin-top:18px"></section>
    <section class="card" style="margin-top:18px"><h3>🧾 Sales in period</h3><div id="salesTable"></div></section>
    <section class="card" style="margin-top:18px"><h3>🏆 Best selling products</h3><div id="bestTable"></div></section>
  </main>
</div>
<div id="toast"></div>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
