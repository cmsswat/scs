<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Swat Computer Shop</title>
<meta name="description" content="Overview of stock value, sales, profit and low-stock alerts for Swat Computer Shop.">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="banner">
      <img src="images/banner.jpg" alt="Computer shop banner">
      <div class="cap"><h3>Welcome back 👋</h3><p>Here is what is happening in your shop today.</p></div>
    </section>
    <section class="grid cols-4" id="stats"></section>
    <section class="grid cols-2" style="margin-top:18px">
      <div class="card"><h3>🧾 Recent sales</h3><div id="recentSales"></div></div>
      <div class="card"><h3>⚠️ Low stock alerts</h3><div id="lowStock"></div></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
