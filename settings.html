<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | Swat Computer Shop</title>
<meta name="description" content="Change shop name, address, currency, low-stock limit and login password of the management system.">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="grid cols-2">
      <div class="card">
        <h3>🏪 Shop information</h3>
        <form id="shopForm" autocomplete="off">
          <div class="field"><label for="shopName">Shop name</label><input type="text" id="shopName"></div>
          <div class="field"><label for="address">Address</label><input type="text" id="address"></div>
          <div class="row">
            <div class="field"><label for="phone">Phone</label><input type="text" id="phone"></div>
            <div class="field"><label for="currency">Currency symbol</label><input type="text" id="currency"></div>
          </div>
          <div class="field"><label for="lowStock">Low stock limit</label><input type="number" id="lowStock" min="1"></div>
          <button class="btn green" type="submit">💾 Save settings</button>
        </form>
      </div>
      <div class="card">
        <h3>🔐 Login &amp; data</h3>
        <form id="userForm" autocomplete="off">
          <div class="field"><label for="username">Username</label><input type="text" id="username"></div>
          <div class="field"><label for="password">Password</label><input type="text" id="password"></div>
          <button class="btn" type="submit">🔑 Update login</button>
        </form>
        <hr style="margin:18px 0;border:none;border-top:1px solid var(--line)">
        <button class="btn red" id="resetBtn" type="button">🗑️ Reset all data (demo)</button>
        <p style="margin-top:10px;font-size:12.5px;color:var(--muted)">
          Reset clears products, purchases and sales stored in this browser and loads the sample data again.</p>
      </div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
